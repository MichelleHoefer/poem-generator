<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Poem Generator</h1>
      </header>

      <main>
        <form id="poem-generator-form">
          <input
            type="text"
            name=""
            id=""
            placeholder="Enter the topic of your poem."
            autofocus
            required
            autocomplete="off"
            class="prompt"
          />
          <input class="submitButton" type="submit" />
        </form>

        <div class="poem" id="poem"></div>
      </main>

      <footer>
        Coded by
        <a href="https://github.com/MichelleHoefer" target="_blank"
          >Michelle Hoefer</a
        >, open-sourced on
        <a
          href="https://github.com/MichelleHoefer/poem-generator.git"
          target="_blank"
          >Github</a
        >
        and hosted by
        <a href="https://hoefer-poem-generator.netlify.app/" target="_blank"
          >Netlify</a
        >.
      </footer>
    </div>
    <script src="src/app.js"></script>
  </body>
</html>
