<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Poem Generator</h1>
      </header>

      <main>
        <div class="form-container">
          <form id="poem-generator-form">
            <input
              type="text"
              placeholder="What would you like a poem about? Write here."
              autofocus
              required
              autocomplete="off"
              class="prompt"
              id="user-prompt"
            />
            <input class="submitButton" type="submit" />
          </form>
          <div class="hint">
            Pick any topic that you like. AI doesn't judge.
          </div>
        </div>
        <div class="poem hidden" id="poem">Your poem will appear here</div>
      </main>

      <footer>
        Coded by
        <a href="https://github.com/MichelleHoefer" target="_blank"
          >Michelle Hoefer</a
        >, open-sourced on
        <a
          href="https://github.com/MichelleHoefer/poem-generator.git"
          target="_blank"
          >Github</a
        >
        and hosted by
        <a href="https://hoefer-poem-generator.netlify.app/" target="_blank"
          >Netlify</a
        >.
      </footer>
    </div>
    <script src="src/app.js"></script>
  </body>
</html>
